name: kasir_anna_seragam
description: Aplikasi kasir (POS) offline untuk UMKM toko seragam.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  intl: '>=0.19.0 <0.21.0'
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  print_bluetooth_thermal: ^1.1.2
  esc_pos_utils_plus: ^2.0.4
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  share_plus: ^10.1.0
  file_picker: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
